<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14503b" />
  <meta name="description" content="Controle de estoque e produtos da Cantina do Colégio Presidente Kennedy." />
  <title>Cantina Presidente Kennedy</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8.5v7a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 15.5v-7a2 2 0 0 1 1-1.73l7-4a2 2 0 0 1 2 0l7 4A2 2 0 0 1 21 8.5Z"/><path d="m3.3 7.5 8.7 5 8.7-5"/><path d="M12 22V12.5"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 4v16"/><path d="m6 14 6 6 6-6"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 20V4"/><path d="m6 10 6-6 6 6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></symbol>
    <symbol id="i-money" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M4 8h12v6a6 6 0 0 1-12 0Z"/><path d="M16 9h2a3 3 0 0 1 0 6h-2"/><path d="M3 21h15"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"><svg class="ic"><use href="#i-coffee"></use></svg></span>
        <div class="brand-text">
          <strong>Cantina</strong>
          <span>Presidente Kennedy</span>
        </div>
      </div>

      <nav class="nav" aria-label="Navegação principal">
        <button class="nav-btn active" data-view="painel" type="button">
          <svg class="ic"><use href="#i-grid"></use></svg><span>Painel</span>
        </button>
        <button class="nav-btn" data-view="produtos" type="button">
          <svg class="ic"><use href="#i-box"></use></svg><span>Produtos</span>
        </button>
        <button class="nav-btn" data-view="movimentacoes" type="button">
          <svg class="ic"><use href="#i-history"></use></svg><span>Movimentações</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="status"><span class="dot"></span> Sincronizado</div>
        <p>Os dados ficam salvos no servidor da cantina e são compartilhados entre os aparelhos.</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="titles">
          <p class="eyebrow" id="pageEyebrow">Painel</p>
          <h1 id="pageTitle">Visão geral</h1>
        </div>
        <div class="topbar-actions">
          <span class="date-chip" id="dateChip"></span>
          <button class="icon-btn" id="btnAtualizar" type="button" title="Atualizar dados" aria-label="Atualizar dados">
            <svg class="ic"><use href="#i-refresh"></use></svg>
          </button>
          <button class="icon-btn" id="btnPin" type="button" title="Acesso com PIN" aria-label="Acesso com PIN">
            <svg class="ic"><use href="#i-lock"></use></svg>
          </button>
        </div>
      </header>

      <section class="view" id="view-painel">
        <div class="stats" id="stats"></div>
        <div class="panel-grid">
          <section class="card">
            <div class="card-head">
              <div>
                <h2>Estoque em alerta</h2>
                <p>Produtos no limite ou em falta</p>
              </div>
              <button class="link-btn" data-goto="produtos" type="button">Ver produtos</button>
            </div>
            <div id="alertList"></div>
          </section>
          <section class="card">
            <div class="card-head">
              <div>
                <h2>Últimas movimentações</h2>
                <p>Entradas, saídas e ajustes</p>
              </div>
              <button class="link-btn" data-goto="movimentacoes" type="button">Histórico</button>
            </div>
            <div id="recentList"></div>
          </section>
        </div>
      </section>

      <section class="view" id="view-produtos" hidden>
        <div class="toolbar">
          <label class="search">
            <svg class="ic"><use href="#i-search"></use></svg>
            <input id="busca" type="search" placeholder="Buscar por nome ou categoria" autocomplete="off" />
          </label>
          <select id="filtroCategoria" aria-label="Filtrar por categoria">
            <option value="">Todas as categorias</option>
          </select>
          <select id="filtroStatus" aria-label="Filtrar por status">
            <option value="">Todos os status</option>
            <option value="alerta">Somente alertas</option>
            <option value="falta">Em falta</option>
            <option value="baixo">Estoque baixo</option>
            <option value="ok">Disponíveis</option>
          </select>
          <button class="btn ghost" id="btnExportar" type="button">
            <svg class="ic"><use href="#i-download"></use></svg> Exportar
          </button>
          <button class="btn primary" id="btnNovo" type="button">
            <svg class="ic"><use href="#i-plus"></use></svg> Novo produto
          </button>
        </div>

        <div class="card list-card">
          <div class="list-head prod-grid" aria-hidden="true">
            <span>Produto</span>
            <span>Preço</span>
            <span>Estoque</span>
            <span>Status</span>
            <span class="right">Ações</span>
          </div>
          <div id="produtosList"></div>
          <div class="list-foot" id="produtosInfo"></div>
        </div>
      </section>

      <section class="view" id="view-movimentacoes" hidden>
        <div class="toolbar">
          <select id="filtroTipo" aria-label="Filtrar por tipo">
            <option value="">Todos os tipos</option>
            <option value="entrada">Entradas</option>
            <option value="saida">Saídas</option>
            <option value="ajuste">Ajustes</option>
          </select>
          <span class="toolbar-note" id="movInfo"></span>
        </div>
        <div class="card" id="movsList"></div>
      </section>
    </main>
  </div>

  <dialog id="dialog" class="dialog"></dialog>
  <dialog id="pinDialog" class="dialog"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
